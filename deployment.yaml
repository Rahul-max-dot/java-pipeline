apiVersion: apps/v1

kind: Deployment

metadata:
  name: my-java-app

spec:

  replicas: 2

  selector:
    matchLabels:
      app: my-java-app


  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 0

      maxSurge: 1


  template:

    metadata:

      labels:
        app: my-java-app


    spec:

      containers:

        - name: my-java-app

          image: YOUR_DOCKER_USERNAME/my-java-app:latest

          imagePullPolicy: Always


          ports:

            - containerPort: 8080


          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"


            limits:

              cpu: "500m"

              memory: "512Mi"


          readinessProbe:

            httpGet:

              path: /

              port: 8080

            initialDelaySeconds: 30

            periodSeconds: 10


          livenessProbe:

            httpGet:

              path: /

              port: 8080

            initialDelaySeconds: 60

            periodSeconds: 20
